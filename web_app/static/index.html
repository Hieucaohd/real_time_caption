<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="/static/manifest.webmanifest"><link rel="stylesheet" href="/static/styles.css"><title>Caption Web</title></head>
<body><header><b>Caption Web</b><span id="connection">Đang kết nối…</span></header>
<main>
 <section id="listen" class="page active"><h1>Nghe trên iPhone</h1><label>Cuộc hội thoại<select id="conversation"></select></label><label>Tên cuộc hội thoại mới<input id="title" placeholder="Ví dụ: Bài giảng 29/09"></label><div class="actions"><button id="start" class="primary">🎙 Bắt đầu microphone</button><button id="stop" disabled>■ Dừng</button></div><p class="note">Safari chỉ thu microphone. Để nghe app khác trên iPhone, hãy phát bằng loa để microphone thu lại.</p><div id="captureStatus" class="status">Idle</div><div id="partial" class="partial"></div><pre id="transcript"></pre></section>
 <section id="chat" class="page"><h1>ChatGPT</h1><div id="messages"></div><textarea id="message" rows="3" placeholder="Nhập câu hỏi…"></textarea><div class="checks"><label><input id="attachTranscript" type="checkbox" checked> Transcript</label><label><input id="attachHistory" type="checkbox"> History</label><label><input id="newChat" type="checkbox"> Thread mới</label></div><button id="sendChat" class="primary">Gửi</button></section>
 <section id="summary" class="page"><h1>Summary</h1><button id="sendSummary" class="primary">Tạo summary</button><div id="summaries"></div></section>
 <section id="conversations" class="page"><h1>Conversations</h1><div id="conversationList"></div></section>
 <section id="settings" class="page"><h1>Settings</h1><label>Whisper model<select id="model"><option>tiny.en</option><option>base.en</option><option selected>small.en</option><option>medium.en</option><option>distil-large-v3</option></select></label><label>Run on<select id="compute"><option>auto</option><option>cuda</option><option>cpu</option></select></label><label>Chat power<select id="chatPower"><option value="-1">Giữ nguyên</option><option value="0">Instant</option><option value="1">Medium</option><option value="2">High</option></select></label><label>Summary power<select id="summaryPower"><option value="-1">Giữ nguyên</option><option value="0">Instant</option><option value="1">Medium</option><option value="2">High</option></select></label><button id="saveSettings" class="primary">Save settings</button><a class="install" href="/ca.crt">Tải chứng chỉ CA cho iPhone</a></section>
</main><nav><button data-page="listen">🎙<small>Nghe</small></button><button data-page="chat">💬<small>Chat</small></button><button data-page="summary">✨<small>Summary</small></button><button data-page="conversations">☷<small>Danh sách</small></button><button data-page="settings">⚙<small>Cài đặt</small></button></nav><script src="/static/app.js"></script></body></html>
